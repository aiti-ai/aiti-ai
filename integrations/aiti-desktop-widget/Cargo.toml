[package]
name = "aiti-desktop-widget"
version = "0.2.0"
edition = "2021"
description = "Business-agnostic frameless desktop widget shell (Tauri 2)"
license = "MIT"
repository = "https://github.com/aiti-ai/aiti-ai"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
