<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>aiti devtools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="logo">🛠 aiti devtools</span>
      <label class="switch" title="全局注入开关">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>

    <div class="rows">
      <div class="row">
        <span class="k">桥地址</span>
        <span class="v mono" id="bridgeUrl" title="MCP 桥基地址">—</span>
      </div>
      <div class="row">
        <span class="k">AI 窗</span>
        <span class="v mono" id="aiUrl" title="AI 调试窗地址">—</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="openAi">💬 打开 AI 窗</button>
      <button class="btn" id="openOptions">⚙ 设置</button>
    </div>

    <div class="foot" id="hint"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
