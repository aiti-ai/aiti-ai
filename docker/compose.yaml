# compose.yaml — one-command aiti container start (aiti-docker-image-plan §3.4)
# Usage: docker compose -f docker/compose.yaml up -d
services:
  aiti:
    image: aiti/aiti:full        # or :core (base)
    container_name: aiti
    ports:
      - "30142:30142"            # pi-web (required)
      - "8777:8777"              # aiti-bridge (optional, external MCP)
      # GUI/CDP/RDP/tunnel ports are not mapped by default (secure defaults, design §5 R5); open as needed:
      # - "6080:6080"  noVNC · "5900:5900" VNC · "9222:9222" CDP · "3389:3389" RDP · "7681:7681" ttyd
    volumes:
      # ⚠ Mount only mutable sub-paths, never the whole /opt/aiti root (O22, smoke-verified): a named volume
      # populates once on first use; afterwards the old volume shadows the new image — mounting the root means extensions never update across image upgrades.
      - aiti_data:/opt/aiti/data    # extension runtime data (config store / indexes / caches)
      - aiti_agent:/opt/aiti/agent  # pi session JSONL/models/mcp-cache (the moat — always persist)
      - ./workspace:/workspace      # real projects (required; fixed in-container path, default cwd at startup)
      # optional: inherit host pi config → - ~/.pi:/home/aiti/.pi
      # optional: cache → - cache:/home/aiti/.cache
    working_dir: /workspace      # default cwd at container startup
    environment:
      PUID: "1000"              # runtime uid (align with the host user so mounts just work; do not use UID — read-only bash builtin)
      PGID: "1000"
      AITI_MODE: full           # core | full | auto (default probes the image-layer marker)
      AITI_PHASES: piweb,bridge # append gui,asr,term as needed
      TZ: Asia/Shanghai
    init: true                   # signal forwarding (no systemd dependency)
    restart: unless-stopped

volumes:
  aiti_data:
  aiti_agent:
