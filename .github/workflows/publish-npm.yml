# publish-npm.yml — publish to the npm official registry (registry.npmjs.org, @aiti-ai scope).
#
# Trigger: workflow_dispatch (manual)
#   dry_run: true (default) — run the full official gate (the 15-item release-audit) +
#   the contentHash decision matrix, audit only; false — publish for real.
#   only: optional comma-separated dir name filter (e.g. "aiti-cmd,session-manager").
#
# Publish scope: extensions/ (63+ extensions) + pi-plugins/ + packages/ (the aiti-devtools family).
# Decision matrix (tools/publish-all.mjs): unchanged content skips; changed content auto-bumps the patch version; official-registry versions
# without a contentHash count as changed and converge; every official publish is gated by release-audit, FAIL blocks it.
#
# Auth: NPM_TOKEN secret (granular automation token, packages read/write on @aiti-ai) —
# written into ~/.npmrc by setup-node (//registry.npmjs.org/:_authToken).
# Upgrade path (token-free): npmjs Trusted Publishing (OIDC) — requires binding each package on npmjs.com to
# the GitHub repo + workflow file; until that is done, NPM_TOKEN is used.

name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (audit + decision matrix, no publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      only:
        description: "Comma-separated dir names to publish (empty = all)"
        required: false
        default: ""
      registry:
        description: "Target registry (aliyun needs ALIYUN_NPM_USERNAME/PASSWORD secrets)"
        required: false
        default: "npmjs"
        type: choice
        options:
          - "npmjs"
          - "aliyun"

permissions:
  contents: read
  id-token: write # npm provenance（official 发布自动带 --provenance）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org" # 写入 ~/.npmrc（NODE_AUTH_TOKEN 占位）

      - name: Preflight — registry identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ALIYUN_NPM_USERNAME: ${{ secrets.ALIYUN_NPM_USERNAME }}
          ALIYUN_NPM_PASSWORD: ${{ secrets.ALIYUN_NPM_PASSWORD }}
        run: |
          if [[ "${{ inputs.registry }}" == "aliyun" ]]; then
            npm ping --registry https://packages.aliyun.com/63a415398d9a873a30aae528/npm/npm-registry/
          else
            npm whoami --registry https://registry.npmjs.org
          fi

      # 扩展 build:client 的依赖根（CI checkout 树无扩展 node_modules；dry-run 不跑构建所以
      # 只在实发暴露）——共享构建根 + 每扩展 symlink，同 release.yml prepare 机制
      - name: Prepare shared build root (extension devDeps)
        run: |
          set -e
          BUILD=/tmp/aiti-build-root
          PKGS=/tmp/aiti-local-pkgs
          mkdir -p "$PKGS"
          (cd extensions/_shared && npm pack --pack-destination "$PKGS")
          (cd packages/aiti-bridge && npm pack --pack-destination "$PKGS")
          (cd packages/aiti-devtools-core && npm pack --pack-destination "$PKGS")
          SHARED_TGZ=$(ls "$PKGS"/aiti-ai-ext-shared-*.tgz | head -1)
          BRIDGE_TGZ=$(ls "$PKGS"/aiti-ai-aiti-bridge-*.tgz | head -1)
          CORE_TGZ=$(ls "$PKGS"/aiti-ai-aiti-devtools-core-*.tgz | head -1)
          node scripts/collect-extension-deps.mjs --out "$BUILD/package.json" \
            --file "@aiti-ai/ext-shared=$SHARED_TGZ" \
            --file "@aiti-ai/aiti-bridge=$BRIDGE_TGZ" \
            --file "@aiti-ai/aiti-devtools-core=$CORE_TGZ" \
            --file "justget=$PWD/vendor/npm/justget-0.2.4.tgz" \
            --file "service-tunnels=$PWD/vendor/npm/service-tunnels-0.3.76.tgz" \
            --file "@aiti-ti/ddns=$PWD/vendor/npm/aiti-ti-ddns-0.2.0.tgz"
          npm install --prefix "$BUILD" --legacy-peer-deps --no-audit --no-fund --loglevel=error
          for ext in extensions/*/; do
            [ -d "$ext" ] || continue
            ln -sfn "$BUILD/node_modules" "${ext}node_modules"
          done
          # packages/ 侧（npm run build 需要 node_modules；@aiti-ai/* 依赖经 inject 脚本改为
          # vendor file + overrides 传递闭环——npmjs 无该 scope。install 后还原 package.json
          # （发布内容保持 semver deps），已装 node_modules 供 publish-all 阶段的 build 使用
          for d in packages/*/; do
            pj="${d}package.json"
            [ -f "$pj" ] || continue
            rm -f "${d}package-lock.json"   # 构建注入态下 lock 与改写不符（精确 spec 撞 npmjs 404），发布包不需要它
            cp "$pj" "$pj.orig"
            node scripts/inject-vendor-deps.mjs "$pj" "$PWD/vendor/npm"
            (cd "$d" && npm install --legacy-peer-deps --no-audit --no-fund --loglevel=error)
            # esbuild 兜底（在还原前：file 态下 npm 全树可解析；还原后重算会撞精确 spec 的 npmjs 404）——
            # 部分包无 deps 字段（esbuild 隐式靠仓根），prepublishOnly/build 需要
            [ -x "${d}node_modules/.bin/esbuild" ] || (cd "$d" && npm install --no-save esbuild --legacy-peer-deps --no-audit --no-fund --loglevel=error)
            mv "$pj.orig" "$pj"   # 还原（node_modules 保留）
          done
          # dist 直塞：vendor tgz（48 构建的同版本产物）解出 dist 覆盖进包目录——
          # publish-all 对非空 dist 跳过构建（绕开各包 build 脚本的 esbuild 解析差异）
          for d in packages/*/; do
            name=$(node -p "try{require('./${d}package.json').name.replace(/^@/,'').replace('/','-')}catch{}" 2>/dev/null || echo "")
            tgz="vendor/npm/${name}.tgz"
            [ -f "$tgz" ] || continue
            mkdir -p /tmp/pkgdist "$d/dist"
            rm -rf /tmp/pkgdist/* && tar xzf "$tgz" -C /tmp/pkgdist
            if [ -d /tmp/pkgdist/package/dist ]; then cp -r /tmp/pkgdist/package/dist/. "$d/dist/"; fi
            rm -rf /tmp/pkgdist
          done


      - name: Publish (registry target, gated)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ALIYUN_NPM_USERNAME: ${{ secrets.ALIYUN_NPM_USERNAME }}
          ALIYUN_NPM_PASSWORD: ${{ secrets.ALIYUN_NPM_PASSWORD }}
        run: |
          ARGS="--target ${{ inputs.registry || 'npmjs' }}"
          if [[ "${{ inputs.registry }}" != "aliyun" ]]; then
            ARGS="--target official"
          fi
          if [[ "${{ inputs.dry_run }}" != "false" ]]; then ARGS="$ARGS --dry-run"; fi
          if [[ -n "${{ inputs.only }}" ]]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          node tools/publish-all.mjs $ARGS 2>&1 | tee publish-report.txt
          grep -qE "失败 [1-9]" publish-report.txt && echo "::error::有包发布失败，详见上方报告" && exit 1
          true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: publish-report
          path: publish-report.txt
          retention-days: 30
