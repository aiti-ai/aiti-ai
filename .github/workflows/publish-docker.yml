# publish-docker.yml — Docker Hub + Aliyun ACR publishing (aitiai/pi-web).
#
# Trigger: workflow_dispatch (manual only — the auto-run on tag push is suspended,
# like the other publish pipelines). Optional version tag input.
# readme_only=true skips the registry gate and builds and only syncs the Hub README
# (docker/README.md → hub.docker.com/r/aitiai/pi-web overview).
#
# Artifacts: aitiai/pi-web:{core,full} + aitiai/pi-web:v<ver>-{core,full} + latest
#             mirrored 1:1 to Aliyun ACR (registry.cn-hangzhou.aliyuncs.com/aiti-ai/pi-web)
# Required secrets: DOCKERHUB_USERNAME (=aitiai), DOCKERHUB_TOKEN (hub.docker.com access token)
#                   ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD (Aliyun container registry account)
#
# Builds reuse docker/build.sh (the repo assembles its own staging context); the full image's FROM base is
# resolved via the CORE_IMAGE alias (parameterized in build.sh; see docker/Dockerfile.full ARG CORE_IMAGE).
#
# RELEASE ORDER (step 3; enforced by the deps-on-registry guard below):
#   1. "NPM Publish" (publish-npm.yml) — extensions/ + pi-plugins/ + packages/ first.
#   2. "Release" (publish.yml) — the main package @aiti-ai/pi-web on npmjs + GHCR.
#   3. THIS workflow — core/full builds pull the @aiti-ai/* dependency closure from the
#      registry (build.sh official chain), so the guard verifies both the exact main
#      package version (full installs it) and the shared extension deps (step 1).

name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g. v0.16.0-aiti.1) for image tags; default: ref name"
        required: false
        default: ""
      npm_registry:
        description: "@aiti-ai/* dependency registry for in-image installs (aliyun needs secrets)"
        required: false
        default: "npmjs"
        type: choice
        options:
          - "npmjs"
          - "aliyun"
      readme_only:
        description: "Only sync the Docker Hub README (skip gate + builds)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE: aitiai/pi-web

jobs:
  # Gate (step 3 of the release order): the official build chain pulls the main
  # package (full installs @aiti-ai/pi-web@<version>) and the shared extension
  # deps (core/full dependency closure) from the npm registry — both must already
  # be published, otherwise fail fast with an actionable message.
  deps-on-registry:
    if: ${{ inputs.readme_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the main package version and shared deps are on the npm registry
        run: |
          V="${{ inputs.version_tag }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          VERSION=${V#v}
          if npm view "@aiti-ai/pi-web@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "ok: @aiti-ai/pi-web@$VERSION"
          else
            echo "::error::@aiti-ai/pi-web@$VERSION is not on the npm registry — run the 'Release' workflow (publish.yml, step 2 of the release order) for this version first"
            exit 1
          fi
          missing=0
          for spec in "@aiti-ai/ext-shared" "@aiti-ai/aiti-bridge" "@aiti-ai/aiti-devtools-core" "justget" "service-tunnels"; do
            if npm view "$spec" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "ok: $spec"
            else
              echo "::error::$spec is not on the npm registry — run the 'NPM Publish' workflow first (step 1 of the release order: extensions + pi-plugins + packages)"
              missing=1
            fi
          done
          exit $missing

  build-push:
    needs: deps-on-registry
    if: ${{ inputs.readme_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version_tag }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Free disk space (core build installs full npm closure)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - name: Registry env (aliyun scope + credentials)
        run: |
          if [[ "${{ inputs.npm_registry }}" == "aliyun" ]]; then
            echo "AITI_PRIVATE_REGISTRY=https://packages.aliyun.com/63a415398d9a873a30aae528/npm/npm-registry/" >> "$GITHUB_ENV"   # build.sh 读取名
            echo "AITI_NPM_REGISTRY_USER=${{ secrets.ALIYUN_NPM_USERNAME }}" >> "$GITHUB_ENV"
            echo "AITI_NPM_REGISTRY_PASS=${{ secrets.ALIYUN_NPM_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build core
        run: |
          ./docker/build.sh --target core \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-core"
          # rolling tag 立即打（Build full 的 CORE_IMAGE 别名解析依赖它）
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:core"

      - name: Build full (FROM core via CORE_IMAGE alias)
        run: |
          ./docker/build.sh --target full \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-full"

      - name: Tag rolling refs
        run: |
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:core"
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-full" "${IMAGE}:full"
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:latest"

      - name: Push all
        run: |
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-core"
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-full"
          docker push "${IMAGE}:core"
          docker push "${IMAGE}:full"
          docker push "${IMAGE}:latest"

      # Mirror the exact same images to Aliyun ACR (CN acceleration). Re-tags the
      # local images built above — no rebuild, no re-pull. Secrets must exist or
      # this step fails (docker.io push already succeeded at this point).
      - name: Mirror to Aliyun ACR
        env:
          ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/aiti-ai/pi-web
        run: |
          printf '%s' "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com \
            --username "${{ secrets.ALIYUN_ACR_USERNAME }}" --password-stdin
          for ref in "${{ steps.ver.outputs.version }}-core" "${{ steps.ver.outputs.version }}-full" core full latest; do
            docker tag "${IMAGE}:${ref}" "${ACR_IMAGE}:${ref}"
            docker push "${ACR_IMAGE}:${ref}"
          done
          docker logout registry.cn-hangzhou.aliyuncs.com

      - name: Summary
        run: |
          echo "### Docker Hub 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${{ steps.ver.outputs.version }}-core\` / \`-full\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`core\` / \`full\` / \`latest\`（rolling）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 阿里云镜像：\`registry.cn-hangzhou.aliyuncs.com/aiti-ai/pi-web\`（同 tag 已同步）" >> "$GITHUB_STEP_SUMMARY"

  # Hub overview sync (docker/README.md → hub.docker.com/r/aitiai/pi-web).
  # Independent of the image build (idempotent, no registry side effects), so it runs
  # even when the gate/builds were skipped by readme_only=true.
  sync-readme:
    needs: build-push
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sync Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # PAT with read/write scope
          repository: aitiai/pi-web
          short-description: "AITI Web — browser workbench for the pi coding agent (core / full Docker images)"
          readme-filepath: ./docker/README.md
