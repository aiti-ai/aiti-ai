# publish-docker.yml — Docker Hub publishing (aitiai/pi-web).
#
# Trigger:
#   - push tag v* (synced with GitHub Releases: images ship with each version)
#   - workflow_dispatch (manual, optional version tag)
#
# Artifacts: aitiai/pi-web:{core,full} + aitiai/pi-web:v<ver>-{core,full} + latest
# Required secrets: DOCKERHUB_USERNAME (=aitiai), DOCKERHUB_TOKEN (hub.docker.com access token)
#
# Builds reuse docker/build.sh (the repo assembles its own staging context); the full image's FROM base is
# resolved via the CORE_IMAGE alias (parameterized in build.sh; see docker/Dockerfile.full ARG CORE_IMAGE).

name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g. v0.16.0-aiti.1) for image tags; default: ref name"
        required: false
        default: ""
      npm_registry:
        description: "@aiti-ai/* dependency registry for in-image installs (aliyun needs secrets)"
        required: false
        default: "npmjs"
        type: choice
        options:
          - "npmjs"
          - "aliyun"

permissions:
  contents: read

env:
  IMAGE: aitiai/pi-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version_tag }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Free disk space (core build installs full npm closure)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - name: Registry env (aliyun scope + credentials)
        run: |
          if [[ "${{ inputs.npm_registry }}" == "aliyun" ]]; then
            echo "AITI_PRIVATE_REGISTRY=https://packages.aliyun.com/63a415398d9a873a30aae528/npm/npm-registry/" >> "$GITHUB_ENV"   # build.sh 读取名
            echo "AITI_NPM_REGISTRY_USER=${{ secrets.ALIYUN_NPM_USERNAME }}" >> "$GITHUB_ENV"
            echo "AITI_NPM_REGISTRY_PASS=${{ secrets.ALIYUN_NPM_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build core
        run: |
          ./docker/build.sh --target core \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-core"
          # rolling tag 立即打（Build full 的 CORE_IMAGE 别名解析依赖它）
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:core"

      - name: Build full (FROM core via CORE_IMAGE alias)
        run: |
          ./docker/build.sh --target full \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-full"

      - name: Tag rolling refs
        run: |
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:core"
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-full" "${IMAGE}:full"
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:latest"

      - name: Push all
        run: |
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-core"
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-full"
          docker push "${IMAGE}:core"
          docker push "${IMAGE}:full"
          docker push "${IMAGE}:latest"

      - name: Summary
        run: |
          echo "### Docker Hub 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${{ steps.ver.outputs.version }}-core\` / \`-full\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`core\` / \`full\` / \`latest\`（rolling）" >> "$GITHUB_STEP_SUMMARY"
