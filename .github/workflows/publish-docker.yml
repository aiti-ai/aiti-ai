# publish-docker.yml —— Docker Hub 发布（aitiai/pi-web）。
#
# 触发：
#   - push tag v*（与 GitHub Releases 同步：镜像随版本发布）
#   - workflow_dispatch（手动，可指定版本标签）
#
# 产物：aitiai/pi-web:{core,full} + aitiai/pi-web:v<ver>-{core,full} + latest
# 依赖 secrets：DOCKERHUB_USERNAME（=aitiai）、DOCKERHUB_TOKEN（hub.docker.com Access Token）
#
# 构建复用 docker/build.sh（本仓自足组装 staging）；full 的 FROM 基座经
# CORE_IMAGE 别名解析（build.sh 已参数化，docker/Dockerfile.full ARG CORE_IMAGE）。

name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g. v0.15.7) for image tags; default: ref name"
        required: false
        default: ""
      npm_registry:
        description: "@aiti-ai/* dependency registry for in-image installs (aliyun needs secrets)"
        required: false
        default: "npmjs"
        type: choice
        options:
          - "npmjs"
          - "aliyun"

permissions:
  contents: read

env:
  IMAGE: aitiai/pi-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version_tag }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Free disk space (core build installs full npm closure)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - name: Registry env (aliyun scope + credentials)
        run: |
          if [[ "${{ inputs.npm_registry }}" == "aliyun" ]]; then
            echo "PRIVREG=https://packages.aliyun.com/63a415398d9a873a30aae528/npm/npm-registry/" >> "$GITHUB_ENV"
            echo "AITI_NPM_REGISTRY_USER=${{ secrets.ALIYUN_NPM_USERNAME }}" >> "$GITHUB_ENV"
            echo "AITI_NPM_REGISTRY_PASS=${{ secrets.ALIYUN_NPM_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build core
        run: |
          ./docker/build.sh --target core \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-core"

      - name: Build full (FROM core via CORE_IMAGE alias)
        run: |
          ./docker/build.sh --target full \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-full"

      - name: Tag rolling refs
        run: |
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:core"
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-full" "${IMAGE}:full"
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}-core" "${IMAGE}:latest"

      - name: Push all
        run: |
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-core"
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-full"
          docker push "${IMAGE}:core"
          docker push "${IMAGE}:full"
          docker push "${IMAGE}:latest"

      - name: Summary
        run: |
          echo "### Docker Hub 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${{ steps.ver.outputs.version }}-core\` / \`-full\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`core\` / \`full\` / \`latest\`（rolling）" >> "$GITHUB_STEP_SUMMARY"
