# aiti-desktop-widget-release.yml — native binaries for integrations/aiti-desktop-widget + npm launcher.
#
# Trigger: push tag aiti-desktop-widget-vX.Y.Z (or workflow_dispatch on that tag ref).
#   1. validate  — tag == Cargo/npm/plist/tauri versions
#   2. test      — cargo fmt/test + npm launcher tests (Linux, no GUI)
#   3. build     — Linux x64, Windows x64, macOS x64 + arm64 (bare binaries)
#   4. release   — checksums.txt + GitHub Release assets
#   5. gitee     — mirror the same assets (non-blocking; AITI_GITEE_TOKEN)
#   6. npm       — publish @aiti-ai/aiti-desktop-widget (non-blocking idempotent skip)
#
# The npm package downloads these assets on first run with justget racing
# GitHub → Gitee → gh-proxy/ghfast/ghproxy mirrors; checksums.txt is verified.
#
# Local release: node integrations/aiti-desktop-widget/scripts/version.mjs --bump patch
#                git commit/tag/push (see integrations/aiti-desktop-widget/RELEASING.md)

name: aiti-desktop-widget Release

on:
  push:
    tags:
      - "aiti-desktop-widget-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build/test all platforms only (no GitHub/Gitee/npm publish; run from main)"
        type: boolean
        default: false

permissions:
  contents: write # GitHub Release create/upload
  id-token: write # npm provenance

concurrency:
  group: aiti-desktop-widget-${{ github.ref }}
  cancel-in-progress: false

env:
  DESKTOP_WIDGET_DIR: integrations/aiti-desktop-widget
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and version sync
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Matrix smoke test from main/branch: versions must agree, tag is not required.
            node "integrations/aiti-desktop-widget/scripts/version.mjs" --check
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" != aiti-desktop-widget-v* ]]; then
              echo "::error::release runs from an aiti-desktop-widget-vX.Y.Z tag (got $TAG); use dry_run=true on main for a build-only run"
              exit 1
            fi
            node "integrations/aiti-desktop-widget/scripts/version.mjs" --check --tag "$TAG"
          fi
          VERSION=$(node "integrations/aiti-desktop-widget/scripts/version.mjs" --print)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.DESKTOP_WIDGET_DIR }} -> target"
      - name: Rust fmt + tests
        run: |
          cargo fmt --manifest-path "integrations/aiti-desktop-widget/Cargo.toml" -- --check
          cargo test --manifest-path "integrations/aiti-desktop-widget/Cargo.toml" --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm launcher tests (offline fake release server)
        run: |
          npm install --prefix "integrations/aiti-desktop-widget/npm" --no-audit --no-fund --ignore-scripts --registry https://registry.npmjs.org
          node --test "integrations/aiti-desktop-widget/npm/test/download.test.mjs" "integrations/aiti-desktop-widget/scripts/publish-gitee.test.mjs"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            asset: aiti-desktop-widget-linux-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            asset: aiti-desktop-widget-win32-x64.exe
            ext: ".exe"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            asset: aiti-desktop-widget-linux-arm64
            ext: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
            asset: aiti-desktop-widget-win32-arm64.exe
            ext: ".exe"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            asset: aiti-desktop-widget-darwin-x64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            asset: aiti-desktop-widget-darwin-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: "${{ env.DESKTOP_WIDGET_DIR }} -> target"

      - name: Build
        run: cargo build --release --manifest-path "integrations/aiti-desktop-widget/Cargo.toml" --target "${{ matrix.target }}"

      - name: Ad-hoc sign (macOS, no bundle)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "integrations/aiti-desktop-widget/target/${{ matrix.target }}/release/aiti-desktop-widget"

      - name: Strip (Linux)
        if: runner.os == 'Linux'
        run: strip "integrations/aiti-desktop-widget/target/${{ matrix.target }}/release/aiti-desktop-widget"

      - name: Stage binary
        run: >-
          node "integrations/aiti-desktop-widget/scripts/stage-binary.mjs"
          --src "integrations/aiti-desktop-widget/target/${{ matrix.target }}/release/aiti-desktop-widget${{ matrix.ext }}"
          --dest "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: widget-${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [validate, build]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: widget-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum aiti-desktop-widget-* > checksums.txt
          cat checksums.txt
      - name: Create/update GitHub Release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ needs.validate.outputs.version }}"
          NOTES="Native aiti-desktop-widget ${VERSION} binaries.

          Install via npm: npm i -g @aiti-ai/aiti-desktop-widget (downloads with justget: GitHub → Gitee → gh-proxy mirrors, sha256-verified)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "aiti-desktop-widget ${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" --title "aiti-desktop-widget ${VERSION}" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  gitee:
    needs: release
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: widget-*
          merge-multiple: true
          path: dist
      - name: Mirror to Gitee
        env:
          AITI_GITEE_TOKEN: ${{ secrets.AITI_GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node "integrations/aiti-desktop-widget/scripts/publish-gitee.mjs" \
            --tag "${{ github.ref_name }}" \
            --assets-dir dist

      # Gitee release creation auto-tags its main; overwrite it with the real
      # annotated tag from GitHub so tag and code stay consistent on the mirror.
      - name: Sync release tag to Gitee
        env:
          AITI_GITEE_TOKEN: ${{ secrets.AITI_GITEE_TOKEN }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git push "https://git:${AITI_GITEE_TOKEN}@gitee.com/aiti-ai/aiti-ai.git" \
            "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

  npm:
    # GitHub assets are enough for npm; Gitee is a best-effort mirror and must not
    # block the publish (npm can run in parallel with the gitee job).
    needs: release
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Version sync
        run: node "integrations/aiti-desktop-widget/scripts/version.mjs" --check --tag "${{ github.ref_name }}"
      - name: Publish @aiti-ai/aiti-desktop-widget
        working-directory: integrations/aiti-desktop-widget/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@aiti-ai/aiti-desktop-widget@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@aiti-ai/aiti-desktop-widget@$VERSION already published — skipping"
            exit 0
          fi
          npm pack --dry-run
          npm publish --access public --provenance
