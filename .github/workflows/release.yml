# release.yml — GitHub Releases pipeline (triggered by v* tags, standard OSS convention).
#
# Trigger: node scripts/release-tag.mjs   （守卫：package.json 必须 X.Y.Z-aiti.N，tag 固定 v<version>）
#          → git tag v0.16.0-aiti.1 && git push origin v0.16.0-aiti.1
# Artifacts: aiti-web-v<ver>-{linux,darwin}-{x64,arm64}.tar.gz + aiti-web-v<ver>-win-x64.zip
#        + checksums.txt (sha256-verified by install.sh / install.ps1 at download time)
#        + checksums.txt (sha256-verified by install.sh / install.ps1 at download time)
# Layout: prepare (linux, platform-agnostic build: .next + 49 extension dists → npm tgz)
#       → archive (4-platform matrix: npm tgz + each platform's production closure → per-platform archives)
#       → release (collect uploads + gh release create --generate-notes)
#
# Note: the npm channel (publish-all) is independent of this pipeline — GitHub Releases is handled here.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create / upload

jobs:
  prepare:
    # 平台无关构建层：.next + 扩展 dist 只构建一次（产物是纯 JS，平台 matrix 直接复用）。
    # 依赖策略：私仓 registry 解析到内网 IP（GH runner 不可达），@aiti-ai/* 与 justget/
    # service-tunnels 新版在 npmjs 缺失/过旧——扩展依赖走「共享构建根 + 本地 vendor
    # tgz（vendor/npm/ + 仓内 pack）」：扩展目录零 install，Node/vite walk-up 命中
    # extensions/node_modules (same layout as the dev machine). The vendor layer can retire once the official registry is complete.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version (fork build suffix required)
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-aiti\.[0-9]+$ ]]; then
            echo "::error::package.json version ${VERSION} must be X.Y.Z-aiti.N — bare versions collide with upstream tags (scripts/release-tag.mjs enforces this locally too)"
            exit 1
          fi
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json version ${VERSION} — bump the version before tagging"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (main package — all public on npmjs)
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build .next
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build shared build root (outside extensions/ — must not enter the package)
        run: |
          set -e
          # 脚手架全部放 /tmp：.build-root 的 package.json 含 CI 绝对路径 file: 依赖，
          # 若落在 extensions/ 下会被打进主包、且用户机 reconcile 会把它当扩展读 deps → ENOENT
          BUILD=/tmp/aiti-build-root
          PKGS=/tmp/aiti-local-pkgs
          mkdir -p "$PKGS"
          (cd extensions/_shared && npm pack --pack-destination "$PKGS")
          (cd packages/aiti-bridge && npm pack --pack-destination "$PKGS")
          (cd packages/aiti-devtools-core && npm pack --pack-destination "$PKGS")
          SHARED_TGZ=$(ls "$PKGS"/aiti-ai-ext-shared-*.tgz | head -1)
          BRIDGE_TGZ=$(ls "$PKGS"/aiti-ai-aiti-bridge-*.tgz | head -1)
          CORE_TGZ=$(ls "$PKGS"/aiti-ai-aiti-devtools-core-*.tgz | head -1)
          node scripts/collect-extension-deps.mjs --out "$BUILD/package.json" \
            --file "@aiti-ai/ext-shared=$SHARED_TGZ" \
            --file "@aiti-ai/aiti-bridge=$BRIDGE_TGZ" \
            --file "@aiti-ai/aiti-devtools-core=$CORE_TGZ" \
            --file "justget=$PWD/vendor/npm/justget-0.2.4.tgz" \
            --file "service-tunnels=$PWD/vendor/npm/service-tunnels-0.3.76.tgz" \
            --file "@aiti-ti/ddns=$PWD/vendor/npm/aiti-ti-ddns-0.2.0.tgz"
          # service-tunnels 0.3.76：vendor 自开发机已发布形态——exports 含 ./i18n ./ui-shared
          # （私仓上的同名 0.3.9 是旧 exports，子路径 import 会挂），服务端自引用的
          # service-tunnels/i18n 等由它解析
          npm install --prefix "$BUILD" --legacy-peer-deps --no-audit --no-fund --loglevel=error
          ln -s "$BUILD/node_modules" extensions/node_modules

      - name: Build extension dists (platform-agnostic JS, walk-up resolve)
        run: |
          failed=""
          for ext in extensions/*/; do
            pj="$ext/package.json"
            [ -f "$pj" ] || continue
            bc=$(node -p "try{require('./$pj').scripts?.['build:client']||''}catch{}" 2>/dev/null || echo "")
            [ -n "$bc" ] && [ "$bc" != "true" ] || continue
            echo "::group::build ${ext}"
            # 每扩展 node_modules → 共享根（/tmp 构建根）：build-client.mjs 的
            # node_modules/vite/bin/vite.js 探测直接命中，require 解析同点命中
            ln -sfn /tmp/aiti-build-root/node_modules "${ext}node_modules"
            if (cd "$ext" && npm run build:client); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed="$failed ${ext}"
            fi
          done
          if [ -n "$failed" ]; then echo "::error::extension build failed:$failed"; exit 1; fi

      - name: Materialize _shared sibling copies (deploy.mjs parity — npm pack excludes _shared)
        run: node scripts/materialize-shared.mjs

      - name: npm pack (authoritative files filter)
        run: |
          rm -f extensions/node_modules   # 构建 symlink，勿入包（files 排除为双保险）
          mkdir -p dist-tgz               # --pack-destination 目录必须预存在
          npm pack --pack-destination dist-tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tgz
          path: dist-tgz/*.tgz
          retention-days: 1

      # npm pack 硬排除 package-lock.json——闭包 npm ci 需要它，单独随 artifact 传给平台 job
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

  archive:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64, runner: ubuntu-latest }
          - { os: darwin, arch: x64, runner: macos-15-intel } # Intel（macos-13 淘汰中，runner 队列枯竭）
          - { os: darwin, arch: arm64, runner: macos-latest } # Apple Silicon（macos-14 标签分配失败过）
          - { os: win32, arch: x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: npm-tgz
          path: dist-tgz

      - uses: actions/download-artifact@v4
        with:
          name: package-lock
          path: lock

      - name: Build release archive
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          TGZ=$(ls dist-tgz/*.tgz | head -1)
          node scripts/build-release-archive.mjs \
            --from-tgz "$TGZ" \
            --lock lock/package-lock.json \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Native binary glibc compatibility gate (max GLIBC_2.31)
        shell: bash
        run: |
          # GLIBC is an ELF-only concern — Mach-O (darwin) / PE (windows) binaries
          # cannot require it by definition, so the gate runs on Linux runners only
          # (this also sidesteps tar/unzip format differences per platform).
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "skip: non-Linux platform — GLIBC gate is ELF-only"
            exit 0
          fi
          mkdir -p /tmp/aiti-gate && tar xzf aiti-web-v*.tar.gz -C /tmp/aiti-gate
          # 守门：tarball 内所有 ELF 的最高 GLIBC 符号需求不得超过 2.31（Ubuntu 20.04/Debian 11 级）。
          # 全依赖均为上游 prebuilt 时自动通过；未来引入 node-gyp 现场编译/高版本工具链构建的包
          # 会在此 fail（否则静默打包出仅在最新发行版可跑的二进制）。
          BAD=0
          for f in $(find /tmp/aiti-gate -type f \( -name "*.node" -o -name "*.so" -o -name "*.so.*" \) 2>/dev/null); do
            # || true: pipefail + set -e — an ELF with NO GLIBC symbols (musl builds)
            # makes grep exit 1, which must not kill the step
            MAX=$(objdump -T "$f" 2>/dev/null | grep -oE "GLIBC_2\.[0-9]+" | sort -V | tail -1 || true)
            [ -z "$MAX" ] && continue
            NEED=$(echo "$MAX" | sed "s/GLIBC_2\.//")
            echo "$f → $MAX"
            if (( $(echo "$NEED > 31" | bc -l) )); then echo "::error::GLIBC 需求超限: $f = $MAX"; BAD=1; fi
          done
          exit $BAD

      - name: Checksum
        shell: bash
        run: |
          ASSET=$(ls aiti-web-v* | head -1)
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            aiti-web-v*
            *.sha256
          retention-days: 1

  release:
    needs: archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: release-assets

      - name: Merge checksums
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # 本 job 无 checkout（无 .git），gh 需显式指仓
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "aiti-web ${{ github.ref_name }}" \
            --generate-notes \
            release-assets/*
