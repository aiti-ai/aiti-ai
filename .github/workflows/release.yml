# release.yml —— GitHub Releases 发布流水线（v* tag 触发，开源惯例）。
#
# 触发：git tag v0.15.7 && git push origin v0.15.7
# 产物：aiti-web-v<ver>-{linux,darwin}-{x64,arm64}.tar.gz + aiti-web-v<ver>-win-x64.zip
#        + checksums.txt（install.sh / install.ps1 下载时 sha256 校验）
# 结构：prepare（linux，平台无关构建：.next + 49 扩展 dist → npm tgz）
#       → archive（4 平台 matrix：npm tgz + 各自生产依赖闭包 → 平台压缩包）
#       → release（汇总上传 + gh release create --generate-notes）
#
# 注：npm 渠道（publish-all）与本流水线相互独立——GitHub Releases 走本文件。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create / upload

jobs:
  prepare:
    # 平台无关构建层：.next + 扩展 dist 只构建一次（产物是纯 JS，平台 matrix 直接复用）。
    # 依赖策略：registry.npmjs.org 解析到内网 IP（GH runner 不可达），@aiti-ai/* 与 justget/
    # service-tunnels 新版在 npmjs 缺失/过旧——扩展依赖走「共享构建根 + 本地 vendor
    # tgz（vendor/npm/ + 仓内 pack）」：扩展目录零 install，Node/vite walk-up 命中
    # extensions/node_modules（开发机开发模式同款）。官方源补齐后 vendor 可退役。
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json version ${VERSION} — bump the version before tagging"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (main package — all public on npmjs)
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build .next
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build shared build root (extensions/.build-root)
        run: |
          set -e
          mkdir -p extensions/.local-pkgs
          (cd extensions/_shared && npm pack --pack-destination ../.local-pkgs)
          (cd packages/aiti-bridge && npm pack --pack-destination ../../extensions/.local-pkgs)
          (cd packages/aiti-devtools-core && npm pack --pack-destination ../../extensions/.local-pkgs)
          SHARED_TGZ=$(ls extensions/.local-pkgs/aiti-ai-ext-shared-*.tgz | head -1)
          BRIDGE_TGZ=$(ls extensions/.local-pkgs/aiti-ai-aiti-bridge-*.tgz | head -1)
          CORE_TGZ=$(ls extensions/.local-pkgs/aiti-ai-aiti-devtools-core-*.tgz | head -1)
          node scripts/collect-extension-deps.mjs --out extensions/.build-root/package.json \
            --file "@aiti-ai/ext-shared=$SHARED_TGZ" \
            --file "@aiti-ai/aiti-bridge=$BRIDGE_TGZ" \
            --file "@aiti-ai/aiti-devtools-core=$CORE_TGZ" \
            --file "justget=$PWD/vendor/npm/justget-0.2.4.tgz" \
            --file "service-tunnels=$PWD/vendor/npm/service-tunnels-0.3.76.tgz" \
            --file "@aiti-ti/ddns=$PWD/vendor/npm/aiti-ti-ddns-0.2.0.tgz"
          # service-tunnels 0.3.76：vendor 自 开发机已发布形态——exports 含 ./i18n ./ui-shared
          # （registry.npmjs.org 上的同名 0.3.9 是旧 exports，子路径 import 会挂），服务端自引用的
          # service-tunnels/i18n 等由它解析
          npm install --prefix extensions/.build-root --legacy-peer-deps --no-audit --no-fund --loglevel=error
          ln -s .build-root/node_modules extensions/node_modules

      - name: Build extension dists (platform-agnostic JS, walk-up resolve)
        run: |
          failed=""
          for ext in extensions/*/; do
            pj="$ext/package.json"
            [ -f "$pj" ] || continue
            bc=$(node -p "try{require('./$pj').scripts?.['build:client']||''}catch{}" 2>/dev/null || echo "")
            [ -n "$bc" ] && [ "$bc" != "true" ] || continue
            echo "::group::build ${ext}"
            # 每扩展 node_modules → 共享根（穿透 symlink）：build-client.mjs 的
            # node_modules/vite/bin/vite.js 探测直接命中，require 解析同点命中
            ln -sfn "$PWD/extensions/.build-root/node_modules" "${ext}node_modules"
            if (cd "$ext" && npm run build:client); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed="$failed ${ext}"
            fi
          done
          if [ -n "$failed" ]; then echo "::error::extension build failed:$failed"; exit 1; fi

      - name: npm pack (authoritative files filter)
        run: |
          rm -f extensions/node_modules   # 构建 symlink，勿入包（files 排除为双保险）
          mkdir -p dist-tgz               # --pack-destination 目录必须预存在
          npm pack --pack-destination dist-tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tgz
          path: dist-tgz/*.tgz
          retention-days: 1

      # npm pack 硬排除 package-lock.json——闭包 npm ci 需要它，单独随 artifact 传给平台 job
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

  archive:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64, runner: ubuntu-latest }
          - { os: darwin, arch: x64, runner: macos-15-intel } # Intel（macos-13 淘汰中，runner 队列枯竭）
          - { os: darwin, arch: arm64, runner: macos-latest } # Apple Silicon（macos-14 标签分配失败过）
          - { os: win32, arch: x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: npm-tgz
          path: dist-tgz

      - uses: actions/download-artifact@v4
        with:
          name: package-lock
          path: lock

      - name: Build release archive
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          TGZ=$(ls dist-tgz/*.tgz | head -1)
          node scripts/build-release-archive.mjs \
            --from-tgz "$TGZ" \
            --lock lock/package-lock.json \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Checksum
        shell: bash
        run: |
          ASSET=$(ls aiti-web-v* | head -1)
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            aiti-web-v*
            *.sha256
          retention-days: 1

  release:
    needs: archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: release-assets

      - name: Merge checksums
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "aiti-web ${{ github.ref_name }}" \
            --generate-notes \
            release-assets/*
