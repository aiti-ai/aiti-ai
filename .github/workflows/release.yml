# release.yml —— GitHub Releases 发布流水线（v* tag 触发，开源惯例）。
#
# 触发：git tag v0.15.7 && git push origin v0.15.7
# 产物：aiti-web-v<ver>-{linux,darwin}-{x64,arm64}.tar.gz + aiti-web-v<ver>-win-x64.zip
#        + checksums.txt（install.sh / install.ps1 下载时 sha256 校验）
# 结构：prepare（linux，平台无关构建：.next + 49 扩展 dist → npm tgz）
#       → archive（4 平台 matrix：npm tgz + 各自生产依赖闭包 → 平台压缩包）
#       → release（汇总上传 + gh release create --generate-notes）
#
# 注：npm 渠道（publish-all）与本流水线相互独立——GitHub Releases 走本文件。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create / upload

jobs:
  prepare:
    # 平台无关构建层：.next + 扩展 dist 只构建一次（产物是纯 JS，平台 matrix 直接复用）
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      # @aiti-ai/* 尚未上官方源（等 granular token）——先走测试源；官方发布后可删除
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json version ${VERSION} — bump the version before tagging"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (main package)
        # npm install 而非 ci：lock resolved 指向官方源而 @aiti-ai/* 走测试源（见 env 注释）
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build .next
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build extension dists (49 bundles, platform-agnostic JS)
        run: |
          failed=""
          for ext in extensions/*/; do
            pj="$ext/package.json"
            [ -f "$pj" ] || continue
            bc=$(node -p "try{require('./$pj').scripts?.['build:client']||''}catch{}" 2>/dev/null || echo "")
            [ -n "$bc" ] && [ "$bc" != "true" ] || continue
            echo "::group::build ${ext}"
            if (cd "$ext" && npm install --no-audit --no-fund --loglevel=error && npm run build:client); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed="$failed ${ext}"
            fi
          done
          if [ -n "$failed" ]; then echo "::error::extension build failed:$failed"; exit 1; fi

      - name: npm pack (authoritative files filter)
        run: npm pack --pack-destination dist-tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tgz
          path: dist-tgz/*.tgz
          retention-days: 1

      # npm pack 硬排除 package-lock.json——闭包 npm ci 需要它，单独随 artifact 传给平台 job
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

  archive:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64, runner: ubuntu-latest }
          - { os: darwin, arch: x64, runner: macos-13 }   # Intel
          - { os: darwin, arch: arm64, runner: macos-14 } # Apple Silicon
          - { os: win32, arch: x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      # 同 prepare：@aiti-ai/* 依赖暂走测试源
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: npm-tgz
          path: dist-tgz

      - uses: actions/download-artifact@v4
        with:
          name: package-lock
          path: lock

      - name: Build release archive
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          TGZ=$(ls dist-tgz/*.tgz | head -1)
          node scripts/build-release-archive.mjs \
            --from-tgz "$TGZ" \
            --lock lock/package-lock.json \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Checksum
        shell: bash
        run: |
          ASSET=$(ls aiti-web-v* | head -1)
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            aiti-web-v*
            *.sha256
          retention-days: 1

  release:
    needs: archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: release-assets

      - name: Merge checksums
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "aiti-web ${{ github.ref_name }}" \
            --generate-notes \
            release-assets/*
