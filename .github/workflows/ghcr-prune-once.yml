# ONE-SHOT: delete GHCR package versions that carry no kept tag
# (kept = latest / core / full / 0.15.15-aiti.10 / 0.15). Deleted right after
# running — this file is removed in the same change cycle, not a recurring mechanism.
name: GHCR Prune Once

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete untagged / stale versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="orgs/${{ github.repository_owner }}/packages/container/aiti-ai"
          kept=0; deleted=0
          pass=0
          while :; do
            pass=$((pass+1))
            IDS=$(gh api "$PKG/versions?per_page=100&page=1" --jq '.[] | "\(.id)|\(.metadata.container.tags // [] | join(","))"' 2>/dev/null)
            [ -z "$IDS" ] && break
            pending=0
            while IFS='|' read -r VID TAGS; do
              [ -z "$VID" ] && continue
              if echo "$TAGS" | grep -qE '(^|,)(latest|core|full|0\.15(\.15)?|0\.15\.15-aiti\.10)(,|$)'; then
                kept=$((kept+1))
                echo "KEEP  $VID tags=[$TAGS]"
              else
                CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                  -H "Authorization: Bearer ${{ github.token }}" \
                  "$PKG/versions/$VID")
                deleted=$((deleted+1))
                pending=1
                echo "DEL   $VID tags=[$TAGS] → $CODE"
              fi
            done <<< "$IDS"
            echo "-- pass $pass done (deleted so far: $deleted) --"
            [ "$pending" = "0" ] && break
          done
          echo "=== RESULT: kept=$kept deleted=$deleted ==="
