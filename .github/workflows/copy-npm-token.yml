# copy-npm-token.yml — copy the npmjs publish token (NPM_TOKEN secret) to the
# repos whose publish-npm.yml needs it. Token value never appears in logs
# (masked as ***) and never lands on disk; GH_PAT provides cross-repo secret
# write. One-off helper: delete after use (mirrors the 2026-11-14 run).
name: copy-npm-token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy NPM_TOKEN to target repos via gh (PAT from GH_PAT secret)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NPM_TOKEN_VALUE: ${{ secrets.NPM_TOKEN }}
        run: |
          gh auth status | sed 's/gho_.*/gho_<redacted>/'
          gh secret set NPM_TOKEN -R aiti-ai/pi-subagents-private --body "$NPM_TOKEN_VALUE"
          echo "--- verify (names only) ---"
          gh secret list -R aiti-ai/pi-subagents-private
