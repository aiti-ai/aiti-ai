name: Release

# Publishes @aiti-ai/pi-web to npm and the Docker image to GHCR.
# MANUAL ONLY: dispatch from the Actions tab with the v* tag ref selected (the
# tag must match package.json — verified below). Auto-run on tag push is
# suspended: ship npm packages to the staging registry first, verify, then run
# this deliberately. Auto-publishing produced wrong releases more than once.
# npm uses Trusted Publishing (OIDC): no npm token. The package's Trusted
# Publisher on npmjs.com names this repository and this file (publish.yml), so
# keep its name.
#
# RELEASE ORDER (enforced by the deps-on-registry guard below):
#   1. "NPM Publish" (publish-npm.yml) — extensions/ + pi-plugins/ + packages/
#      first: staging (default) → verify → promote to npmjs.
#   2. THIS workflow — the main package and its bundled extension dists are
#      built against the shared deps (@aiti-ai/ext-shared, aiti-bridge,
#      aiti-devtools-core, justget, service-tunnels) resolved from the npm
#      registry, i.e. the versions published in step 1.
#   3. "Docker Publish" (publish-docker.yml) — Docker Hub; guard verifies the
#      main package version from step 2 is on the registry.
#   (release.yml — GitHub Releases archives — runs after step 1 like this one.)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the bundled extension dists are built against the shared deps resolved
  # from the npm registry (the versions "NPM Publish" published) — not local tgzs.
  # Fail fast with an actionable message when step 1 of the release order was skipped.
  deps-on-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify shared extension deps are on the npm registry
        run: |
          missing=0
          for spec in "@aiti-ai/ext-shared" "@aiti-ai/aiti-bridge" "@aiti-ai/aiti-devtools-core" "justget" "service-tunnels"; do
            if npm view "$spec" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "ok: $spec"
            else
              echo "::error::$spec is not on the npm registry — run the 'NPM Publish' workflow first (step 1 of the release order: extensions + pi-plugins + packages)"
              missing=1
            fi
          done
          exit $missing

  check-tag:
    needs: deps-on-registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  npm:
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or later; Node 24 bundles it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build shared build root (outside extensions/ — must not enter the package)
        run: |
          set -e
          # Same scheme as release.yml prepare: /tmp scaffold, deps+devDeps union shared root.
          # Dependency source = the npm registry (versions published by "NPM Publish"), so the
          # bundled dists are built against what installs will resolve at runtime. The only
          # exception is @aiti-ti/ddns (not on npmjs) — still served from the vendor tgz.
          BUILD=/tmp/aiti-build-root
          mkdir -p "$BUILD"
          node scripts/collect-extension-deps.mjs --out "$BUILD/package.json" \
            --file "@aiti-ti/ddns=$PWD/vendor/npm/aiti-ti-ddns-0.2.0.tgz"
          npm install --prefix "$BUILD" --legacy-peer-deps --no-audit --no-fund --loglevel=error
          ln -s "$BUILD/node_modules" extensions/node_modules
      - name: Build extension dists (client + server worker bundles, walk-up resolve)
        run: |
          failed=""
          for ext in extensions/*/; do
            pj="${ext}package.json"
            [ -f "$pj" ] || continue
            bc=$(node -p "try{require('./$pj').scripts?.['build:client']||''}catch{}" 2>/dev/null || echo "")
            bs=$(node -p "try{require('./$pj').scripts?.['build:server']||''}catch{}" 2>/dev/null || echo "")
            [ -n "$bc" ] && [ "$bc" != "true" ] || [ -n "$bs" ] || continue
            echo "::group::build ${ext}"
            # per-ext node_modules -> the shared /tmp build root: vite/esbuild bin probes and
            # require resolution all hit the shared tree
            ln -sfn /tmp/aiti-build-root/node_modules "${ext}node_modules"
            ok=1
            if [ -n "$bc" ] && [ "$bc" != "true" ]; then (cd "$ext" && npm run build:client) || ok=0; fi
            if [ -n "$bs" ] && [ $ok -eq 1 ]; then (cd "$ext" && npm run build:server) || ok=0; fi
            echo "::endgroup::"
            [ $ok -eq 1 ] || failed="$failed ${ext}"
          done
          if [ -n "$failed" ]; then echo "::error::extension build failed:$failed"; exit 1; fi
      - name: Materialize _shared sibling copies (deploy.mjs parity — npm pack excludes _shared)
        run: node scripts/materialize-shared.mjs
      - name: Remove build symlinks before publish
        run: rm -f extensions/node_modules
      - run: npm publish --tag latest --access public

  container:
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows the newest release tag (the action's default for semver tags).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
