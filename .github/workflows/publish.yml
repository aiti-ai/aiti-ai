name: Release

# Publishes @agegr/pi-web to npm and the Docker image to GHCR.
# MANUAL ONLY: dispatch from the Actions tab with the v* tag ref selected (the
# tag must match package.json — verified below). Auto-run on tag push is
# suspended: ship npm packages to the staging registry first, verify, then run
# this deliberately. Auto-publishing produced wrong releases more than once.
# npm uses Trusted Publishing (OIDC): no npm token. The package's Trusted
# Publisher on npmjs.com names this repository and this file (publish.yml), so
# keep its name.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  npm:
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or later; Node 24 bundles it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build shared build root (outside extensions/ — must not enter the package)
        run: |
          set -e
          # Same scheme as release.yml prepare: /tmp scaffold, deps+devDeps union shared root,
          # @aiti-ai/* via locally packed tgzs, vendor tgzs for internal-only packages
          BUILD=/tmp/aiti-build-root
          PKGS=/tmp/aiti-local-pkgs
          mkdir -p "$PKGS"
          (cd extensions/_shared && npm pack --pack-destination "$PKGS")
          (cd packages/aiti-bridge && npm pack --pack-destination "$PKGS")
          (cd packages/aiti-devtools-core && npm pack --pack-destination "$PKGS")
          SHARED_TGZ=$(ls "$PKGS"/aiti-ai-ext-shared-*.tgz | head -1)
          BRIDGE_TGZ=$(ls "$PKGS"/aiti-ai-aiti-bridge-*.tgz | head -1)
          CORE_TGZ=$(ls "$PKGS"/aiti-ai-aiti-devtools-core-*.tgz | head -1)
          node scripts/collect-extension-deps.mjs --out "$BUILD/package.json" \
            --file "@aiti-ai/ext-shared=$SHARED_TGZ" \
            --file "@aiti-ai/aiti-bridge=$BRIDGE_TGZ" \
            --file "@aiti-ai/aiti-devtools-core=$CORE_TGZ" \
            --file "justget=$PWD/vendor/npm/justget-0.2.4.tgz" \
            --file "service-tunnels=$PWD/vendor/npm/service-tunnels-0.3.76.tgz" \
            --file "@aiti-ti/ddns=$PWD/vendor/npm/aiti-ti-ddns-0.2.0.tgz"
          npm install --prefix "$BUILD" --legacy-peer-deps --no-audit --no-fund --loglevel=error
          ln -s "$BUILD/node_modules" extensions/node_modules
      - name: Build extension dists (client + server worker bundles, walk-up resolve)
        run: |
          failed=""
          for ext in extensions/*/; do
            pj="${ext}package.json"
            [ -f "$pj" ] || continue
            bc=$(node -p "try{require('./$pj').scripts?.['build:client']||''}catch{}" 2>/dev/null || echo "")
            bs=$(node -p "try{require('./$pj').scripts?.['build:server']||''}catch{}" 2>/dev/null || echo "")
            [ -n "$bc" ] && [ "$bc" != "true" ] || [ -n "$bs" ] || continue
            echo "::group::build ${ext}"
            # per-ext node_modules -> the shared /tmp build root: vite/esbuild bin probes and
            # require resolution all hit the shared tree
            ln -sfn /tmp/aiti-build-root/node_modules "${ext}node_modules"
            ok=1
            if [ -n "$bc" ] && [ "$bc" != "true" ]; then (cd "$ext" && npm run build:client) || ok=0; fi
            if [ -n "$bs" ] && [ $ok -eq 1 ]; then (cd "$ext" && npm run build:server) || ok=0; fi
            echo "::endgroup::"
            [ $ok -eq 1 ] || failed="$failed ${ext}"
          done
          if [ -n "$failed" ]; then echo "::error::extension build failed:$failed"; exit 1; fi
      - name: Materialize _shared sibling copies (deploy.mjs parity — npm pack excludes _shared)
        run: node scripts/materialize-shared.mjs
      - name: Remove build symlinks before publish
        run: rm -f extensions/node_modules
      - run: npm publish --tag latest --access public

  container:
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows the newest release tag (the action's default for semver tags).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
