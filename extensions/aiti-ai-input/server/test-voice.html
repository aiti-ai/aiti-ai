<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>aiti-ai-input L2 ASR test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; }
  textarea { width: 100%; height: 120px; font-size: 16px; }
  button { font-size: 16px; padding: 10px 14px; }
  .log { white-space: pre-wrap; background:#f5f5f5; padding:12px; border-radius:8px; margin-top:12px; }
</style>
</head>
<body>
<h1>aiti-ai-input L2 ASR test</h1>
<p>先启动 ASR 服务：<code>bash server/deploy.sh</code> 或 <code>bash server/start.sh</code></p>
<textarea id="out" placeholder="转写结果会出现在这里…"></textarea>
<div style="margin-top:10px; display:flex; gap:10px;">
  <button id="start">🎤 开始录音</button>
  <button id="stop" disabled>⏹ 停止</button>
</div>
<div class="log" id="log">等待操作…</div>
<script>
  const out = document.getElementById('out');
  const log = document.getElementById('log');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  let mediaRecorder = null;
  let chunks = [];
  function addLog(s) { log.textContent = s + '\\n' + log.textContent; }
  startBtn.onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
      chunks = [];
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: mime });
        const fd = new FormData();
        fd.append('audio', blob, 'voice.webm');
        addLog('转写中…');
        try {
          const r = await fetch('/api/extensions/aiti-ai-input/voice-asr', { method: 'POST', body: fd });
          const d = await r.json();
          addLog('转写结果：' + JSON.stringify(d, null, 2));
          if (d && d.text) {
            const sep = (out.value || '').length && !/\\n\\s*$/.test(out.value) ? '\\n' : '';
            out.value = out.value + sep + d.text;
          }
        } catch (e) {
          addLog('请求失败：' + e);
        } finally {
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }
      };
      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      addLog('开始录音…');
    } catch (e) {
      addLog('录音权限被拒或不可用：' + e);
    }
  };
  stopBtn.onclick = () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      addLog('停止录音，等待转写…');
    }
  };
</script>
</body>
</html>
