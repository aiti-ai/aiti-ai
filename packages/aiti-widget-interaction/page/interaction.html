<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aiti widget interaction</title>
<style>
  :root { color-scheme: dark; --bg:#111522; --panel:#171d2d; --fg:#eef2ff; --muted:#9aa7c7; --line:#2a3550; --accent:#8b5cf6; --accent2:#22d3ee; --danger:#f87171; }
  * { box-sizing: border-box; }
  html,body { width:100%; height:100%; margin:0; background:transparent; color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:10px; overflow:auto; }
  #app { width:100%; max-width:560px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px 18px; box-shadow:0 24px 80px rgba(0,0,0,.42); }
  #queue { color:var(--muted); font-size:11px; min-height:15px; text-align:right; }
  h1 { font-size:17px; line-height:1.3; margin:2px 0 8px; font-weight:750; }
  #message { white-space:pre-wrap; font-size:14px; line-height:1.55; margin:0 0 8px; }
  #detail { white-space:pre-wrap; color:var(--muted); font-size:12px; margin:0 0 12px; }
  #kind { color:var(--accent2); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
  #state { color:var(--accent2); font-size:12px; margin:6px 0; white-space:pre-wrap; }
  #error { color:#fecaca; font-size:12px; min-height:1px; margin:6px 0; }
  #options, #actions { display:flex; flex-direction:column; gap:7px; margin:10px 0; }
  button { font:inherit; border-radius:9px; border:1px solid var(--line); background:#202941; color:var(--fg); padding:8px 13px; cursor:pointer; text-align:left; }
  button:hover { background:#2a3654; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { border-color:#a78bfa; background:linear-gradient(135deg,#7c3aed,#5b21b6); font-weight:650; }
  button.danger { border-color:#7f1d1d; color:#fecaca; }
  input, textarea { width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:9px; background:#0e1320; color:var(--fg); padding:9px 10px; font:inherit; }
  textarea { min-height:44px; resize:vertical; }
  #inputwrap { margin:10px 0; }
  #pickwrap { margin:10px 0; display:flex; flex-direction:column; gap:8px; }
  /* author display overrides [hidden] in the UA sheet — keep the attribute effective */
  #pickwrap[hidden] { display:none; }
  #formwrap { margin:10px 0; display:flex; flex-direction:column; gap:8px; }
  #formwrap[hidden] { display:none; }
  .frow { display:flex; flex-direction:column; gap:4px; }
  .frow label { font-size:11px; color:var(--muted); }
  .frow .req { color:#fca5a5; margin-left:3px; }
  .frow .err { font-size:11px; color:#fecaca; min-height:0; }
  #picklist { color:var(--muted); font-size:12px; white-space:pre-wrap; word-break:break-all; }
  #comment { margin:8px 0; }
  #footer { display:flex; align-items:center; gap:8px; justify-content:flex-end; margin-top:10px; }
  #hint { color:var(--muted); font-size:11px; margin-right:auto; }
  #empty { color:var(--muted); text-align:center; padding:28px 8px; }
  #dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:1px; }
</style>
</head>
<body>
<main id="app">
  <div id="queue"></div>
  <div id="card" hidden>
    <div id="kind"></div>
    <h1 id="title"></h1>
    <p id="message"></p>
    <p id="detail"></p>
    <div id="state" hidden></div>
    <div id="options"></div>
    <div id="inputwrap" hidden><input id="input" autocomplete="off"></div>
    <div id="formwrap" hidden></div>
    <div id="pickwrap" hidden>
      <button id="pickbtn" type="button">Choose…</button>
      <div id="picklist"></div>
      <input id="pickinput" type="file" hidden>
    </div>
    <div id="comment"><textarea id="commentinput" placeholder="Optional comment / reason"></textarea></div>
    <div id="error"></div>
    <div id="actions"></div>
    <div id="footer"><span id="hint"></span><button id="cancel" type="button">Cancel</button></div>
  </div>
  <div id="empty"><span id="dot"></span>Waiting for the next interaction…</div>
</main>
<script type="module">
import { connectInteraction } from "./interaction-client.js";

const $ = (id) => document.getElementById(id);
let client;
let activeId = null;
let busy = false;
let lastList = [];
let pickedPaths = [];

function text(value) { return value == null ? "" : String(value); }
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function button(label, onClick, kind) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.className = kind || "";
  b.addEventListener("click", () => { void onClick(b); });
  return b;
}
function requestById(id) { return client?.requests.find((r) => r.id === id) || null; }
function nextRequest() { return client?.requests[0] || null; }
function showError(message) { $("error").textContent = text(message); }
function setBusy(value) {
  busy = value;
  document.querySelectorAll("button").forEach((b) => {
    if (b.id !== "cancel") b.disabled = value;
  });
}

function renderState(request) {
  const state = request?.state || {};
  const entries = Object.entries(state).filter(([, value]) => value != null && typeof value !== "object");
  const stateEl = $("state");
  stateEl.hidden = entries.length === 0;
  stateEl.textContent = entries.map(([key, value]) => `${key}: ${String(value)}`).join(" · ");
}

function renderActions(request) {
  const actions = $("actions");
  clear(actions);
  if (request.kind === "choose" && request.options?.length) return;
  if (request.kind === "form") {
    actions.appendChild(button(request.actions?.find((a) => a.id === "cancel")?.label || "Cancel", async () => {
      await submit(request.id, { action: "cancel" });
    }, "secondary"));
    actions.appendChild(button(request.actions?.find((a) => a.id === "submit")?.label || "Submit", async () => {
      const form = collectForm(request);
      if (!form) return;
      await submit(request.id, { action: "submit", value: form });
    }, "primary"));
    return;
  }
  if (request.kind === "pick_path") {
    actions.appendChild(button("Cancel", async () => { await submit(request.id, { action: "cancel" }); }, "secondary"));
    actions.appendChild(button(request.actions?.find((a) => a.id === "pick")?.label || "OK", async () => {
      const paths = pickedPaths.slice();
      if (!paths.length) { showError("Nothing selected yet."); return; }
      await submit(request.id, { action: "pick", value: { paths } });
    }, "primary"));
    return;
  }
  const list = request.actions?.length
    ? request.actions
    : request.kind === "confirm"
      ? [{ id: "approve", label: "Continue", kind: "primary" }, { id: "reject", label: "Reject", kind: "secondary" }]
      : request.kind === "notify"
        ? [{ id: "dismiss", label: "Dismiss", kind: "primary" }]
        : [{ id: "submit", label: request.kind === "input" ? "Submit" : "Send", kind: "primary" }];
  for (const action of list) {
    actions.appendChild(button(text(action.label || action.id), async () => {
      const payload = { action: action.id, value: action.value };
      if (request.kind === "input") {
      const value = $("input").value;
      const pattern = $("input").dataset.pattern || "";
      if (pattern) {
        let re = null;
        try { re = new RegExp(pattern); } catch { re = null; }
        if (re && !re.test(value)) { showError("Does not match " + pattern); return; }
      }
      payload.value = { text: value };
    }
      if (request.kind === "confirm") payload.approved = action.id !== "reject" && action.id !== "cancel";
      const comment = $("commentinput").value.trim();
      if (comment) payload.comment = comment;
      await submit(request.id, payload);
    }, action.kind || "secondary"));
  }
}

function renderOptions(request) {
  const options = $("options");
  clear(options);
  if (!request.options?.length || request.kind !== "choose") return;
  for (const option of request.options) {
    const b = button(text(option.label || option.id), async () => {
      const comment = $("commentinput").value.trim();
      await submit(request.id, { action: "choose", value: { id: option.id, label: option.label }, ...(comment ? { comment } : {}) });
    }, "secondary");
    if (option.description) b.title = text(option.description);
    if (option.disabled) b.disabled = true;
    options.appendChild(b);
  }
}

function pickTauri() {
  try {
    const api = window.__TAURI__;
    return api && api.dialog && typeof api.dialog.open === "function" ? api.dialog : null;
  } catch { return null; }
}

function extensionFilters(extensions) {
  const list = (extensions || []).map((item) => String(item).replace(/^\*\.?/, "").replace(/^\./, "")).filter(Boolean);
  return list.length ? [{ name: "Supported", extensions: list }] : undefined;
}

async function pickWithTauri(request) {
  const dialog = pickTauri();
  if (!dialog) return null;
  const directory = request.pick?.mode === "directory";
  const picked = await dialog.open({
    directory,
    multiple: request.pick?.multiple === true,
    title: text(request.title) || undefined,
    filters: extensionFilters(request.pick?.extensions),
  });
  if (picked == null) return [];
  return Array.isArray(picked) ? picked.map(String) : [String(picked)];
}

function showPicked(paths) {
  $("picklist").textContent = paths.length ? paths.join("\n") : "";
}

function formInputs(request) {
  return (request.form && request.form.fields) || [];
}

function renderForm(request) {
  const wrap = $("formwrap");
  wrap.textContent = "";
  const fields = formInputs(request);
  wrap.hidden = request.kind !== "form" || fields.length === 0;
  if (wrap.hidden) return;
  for (const field of fields) {
    const row = document.createElement("div");
    row.className = "frow";
    const label = document.createElement("label");
    label.textContent = field.label || field.id;
    if (field.required) {
      const req = document.createElement("span");
      req.className = "req";
      req.textContent = "*";
      label.appendChild(req);
    }
    row.appendChild(label);
    let input;
    if (field.type === "combo" && Array.isArray(field.options) && field.options.length) {
      input = document.createElement("select");
      for (const option of field.options) {
        const opt = document.createElement("option");
        opt.value = String(option);
        opt.textContent = String(option);
        input.appendChild(opt);
      }
      if (field.defaultValue) input.value = field.defaultValue;
    } else {
      input = document.createElement("input");
      input.type = field.type === "password" ? "password" : field.type === "number" ? "number" : "text";
      if (field.placeholder) input.placeholder = field.placeholder;
      if (field.defaultValue !== undefined) input.value = field.defaultValue;
    }
    input.dataset.fieldId = field.id;
    row.appendChild(input);
    const err = document.createElement("div");
    err.className = "err";
    err.dataset.fieldError = field.id;
    row.appendChild(err);
    wrap.appendChild(row);
  }
}

/** Collect form values; returns null when a field fails validation (errors painted inline). */
function collectForm(request) {
  const values = {};
  const order = [];
  let ok = true;
  for (const field of formInputs(request)) {
    const input = document.querySelector('[data-field-id="' + field.id + '"]');
    const err = document.querySelector('[data-field-error="' + field.id + '"]');
    if (err) err.textContent = "";
    const value = input ? String(input.value ?? "") : "";
    order.push(field.id);
    values[field.id] = value;
    if (field.required && !value.trim()) {
      if (err) err.textContent = "Required";
      ok = false;
      continue;
    }
    if (field.pattern) {
      let re = null;
      try { re = new RegExp(field.pattern); } catch { re = null; }
      if (re && !re.test(value)) {
        if (err) err.textContent = "Does not match " + field.pattern;
        ok = false;
      }
    }
  }
  return ok ? { values, order } : null;
}

let fitSeq = 0;
// `?autosize=0` (pinned geometry) keeps the host-requested size: a script that placed the
// card at an exact spot (e.g. outside a capture rect) must not have it grow afterwards.
const AUTOSIZE = new URLSearchParams(location.search).get("autosize") !== "0";
async function autoFit() {
  if (!AUTOSIZE) return;
  const tauri = window.__TAURI__;
  const win = tauri && tauri.window && tauri.window.getCurrentWindow ? tauri.window.getCurrentWindow() : null;
  const dpi = tauri && tauri.dpi;
  if (!win || !dpi) return;
  const seq = ++fitSeq;
  await new Promise((resolve) => requestAnimationFrame(() => resolve()));
  if (seq !== fitSeq) return;
  const rect = $("app").getBoundingClientRect();
  const width = Math.max(240, Math.ceil(rect.width + 20));
  const height = Math.max(120, Math.ceil(rect.height + 20));
  if (Math.abs(width - window.innerWidth) < 4 && Math.abs(height - window.innerHeight) < 4) return;
  try {
    const size = new dpi.LogicalSize(width, height);
    const position = await win.outerPosition();
    const outer = await win.outerSize();
    const scale = await win.scaleFactor();
    const targetW = Math.round(width * scale);
    const targetH = Math.round(height * scale);
    const cx = position.x + outer.width / 2;
    const cy = position.y + outer.height / 2;
    await win.setMinSize(size);
    await win.setMaxSize(size);
    await win.setSize(size);
    await win.setPosition(new dpi.PhysicalPosition(Math.round(cx - targetW / 2), Math.round(cy - targetH / 2)));
  } catch { /* no page-control permission (plain browser) */ }
}

let lastRaisedId = "";

// Best effort: ask the WM for focus when a new card appears (some WMs refuse focus
// stealing; that must not break the interaction).
async function raiseWindow() {
  const tauri = window.__TAURI__;
  const win = tauri && tauri.window && tauri.window.getCurrentWindow ? tauri.window.getCurrentWindow() : null;
  if (!win || typeof win.setFocus !== "function") return;
  try { await win.setFocus(); } catch { /* focus is advisory */ }
}

function render() {
  const request = activeId ? requestById(activeId) : nextRequest();
  if (request && request.id !== lastRaisedId) {
    lastRaisedId = request.id;
    void raiseWindow();
  }
  if (!request) {
    activeId = null;
    $("card").hidden = true;
    $("empty").hidden = false;
    $("queue").textContent = "";
    return;
  }
  if (activeId !== request.id) { pickedPaths = []; showPicked([]); }
  activeId = request.id;
  $("card").hidden = false;
  $("empty").hidden = true;
  const pending = client.requests;
  $("queue").textContent = pending.length > 1 ? `${pending.length - 1} more pending` : "";
  $("kind").textContent = request.kind;
  $("title").textContent = text(request.title) || "Action needed";
  $("message").textContent = text(request.message);
  $("detail").textContent = text(request.detail);
  $("detail").hidden = !request.detail;
  const allowComment = request.data && typeof request.data === "object" && request.data.allowComment === true;
  $("comment").hidden = !(allowComment || request.kind === "input");
  renderForm(request);
  $("commentinput").placeholder = "Optional comment / reason";
  const inputWrap = $("inputwrap");
  inputWrap.hidden = request.kind !== "input";
  const pickWrap = $("pickwrap");
  pickWrap.hidden = request.kind !== "pick_path";
  if (request.kind === "pick_path") {
    const tauri = !!pickTauri();
    $("pickbtn").textContent = request.pick?.mode === "directory" ? "Choose folder…" : "Choose file…";
    $("pickbtn").title = tauri ? "Opens the system picker" : "Browser fallback: the page cannot read absolute paths";
    $("picklist").textContent = tauri ? "" : "Browser mode: absolute paths are unavailable; the selected file name is returned.";
  }
  if (request.kind === "input") {
    $("input").placeholder = text(request.input?.placeholder) || "Type here…";
    $("input").dataset.pattern = text(request.input?.pattern);
    $("input").type = request.input?.secret ? "password" : "text";
    if (!$("input").value) $("input").value = text(request.input?.defaultValue);
  }
  const hasCancelAction = (request.actions || []).some((a) => a.id === "cancel" || a.id === "reject");
  $("cancel").hidden = request.kind === "notify" || hasCancelAction;
  $("hint").textContent = request.timeoutMs > 0 ? `Timeout ${Math.round(request.timeoutMs / 1000)}s` : "";
  renderState(request);
  renderOptions(request);
  renderActions(request);
  renderState(request);
  if (request.kind === "input") setTimeout(() => $("input").focus(), 30);
  if (request.kind !== "input") setTimeout(() => ($("actions").querySelector("button") || $("card")).focus?.(), 30);
  void autoFit();
}

async function submit(id, payload) {
  if (busy) return;
  setBusy(true);
  showError("");
  try {
    const result = await client.answer(id, payload);
    if (result?.keepOpen) {
      showError("");
      renderState(requestById(id) || { state: result.state || {} });
    } else {
      activeId = null;
    }
  } catch (error) {
    showError(error?.message || String(error));
  } finally {
    setBusy(false);
    render();
  }
}

document.addEventListener("keydown", (event) => {
  const request = activeId ? requestById(activeId) : null;
  if (!request || busy) return;
  if (event.key === "Escape") {
    event.preventDefault();
    void submit(request.id, { action: "cancel" });
    return;
  }
  if (event.key === "Enter" && request.kind !== "input" && request.kind !== "pick_path" && request.kind !== "form") {
    const primary = $("actions").querySelector("button.primary");
    if (primary) { event.preventDefault(); primary.click(); }
  }
});

$("pickbtn").addEventListener("click", async () => {
  const request = activeId ? requestById(activeId) : null;
  if (!request || busy) return;
  const dialog = pickTauri();
  if (dialog) {
    setBusy(true);
    showError("");
    try {
      const paths = await pickWithTauri(request);
      pickedPaths = paths || [];
      showPicked(pickedPaths);
      if (pickedPaths.length) {
        await submit(request.id, { action: "pick", value: { paths: pickedPaths } });
        return;
      }
    } catch (error) {
      showError(error?.message || String(error));
    } finally {
      setBusy(false);
      render();
    }
    return;
  }
  const input = $("pickinput");
  input.multiple = request.pick?.multiple === true;
  if (request.pick?.mode === "directory") input.setAttribute("webkitdirectory", "1");
  else input.removeAttribute("webkitdirectory");
  input.click();
});

$("pickinput").addEventListener("change", () => {
  const input = $("pickinput");
  const names = [...(input.files || [])].map((file) => file.webkitRelativePath || file.name);
  pickedPaths = names;
  showPicked(pickedPaths);
  $("pickbtn").textContent = names.length ? "Choose again…" : $("pickbtn").textContent;
});

$("cancel").addEventListener("click", async () => {
  if (!activeId || busy) return;
  setBusy(true);
  showError("");
  try { await client.cancel(activeId); activeId = null; }
  catch (error) { showError(error?.message || String(error)); }
  finally { setBusy(false); render(); }
});

$("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    const request = activeId ? requestById(activeId) : null;
    if (request) void submit(request.id, { action: "submit", value: { text: $("input").value }, ...( $("commentinput").value.trim() ? { comment: $("commentinput").value.trim() } : {}) });
  }
});

// NOTE: no top-level await here — the macOS 11 WKWebView silently skips a module
// script that uses TLA (the page then renders but never connects).
async function start() {
try {
  client = await connectInteraction();
  client.onSnapshot((requests) => {
    lastList = requests;
    if (activeId && !requests.some((r) => r.id === activeId)) activeId = null;
    render();
  });
  client.onRequest(() => render());
  client.onUpdate((id) => { if (activeId === id) render(); });
  client.onResolved((id) => {
    if (activeId === id) activeId = null;
    render();
  });
  client.onError((error) => showError(error.message || String(error)));
  // The initial snapshot is delivered before listeners attach; render from the
  // client's canonical list once the subscription handshake is complete.
  render();
  setTimeout(() => render(), 250);
} catch (error) {
  $("empty").hidden = true;
  $("card").hidden = false;
  $("title").textContent = "Interaction unavailable";
  $("message").textContent = error?.message || String(error);
}
}
void start();
</script>
</body>
</html>
