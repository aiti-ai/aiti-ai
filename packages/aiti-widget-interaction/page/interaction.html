<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aiti widget interaction</title>
<style>
  :root { color-scheme: dark; --bg:#111522; --panel:#171d2d; --fg:#eef2ff; --muted:#9aa7c7; --line:#2a3550; --accent:#8b5cf6; --accent2:#22d3ee; --danger:#f87171; }
  * { box-sizing: border-box; }
  html,body { width:100%; height:100%; margin:0; background:transparent; color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:10px; overflow:hidden; }
  #app { width:100%; max-width:560px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px 18px; box-shadow:0 24px 80px rgba(0,0,0,.42); }
  #queue { color:var(--muted); font-size:11px; min-height:15px; text-align:right; }
  h1 { font-size:17px; line-height:1.3; margin:2px 0 8px; font-weight:750; }
  #message { white-space:pre-wrap; font-size:14px; line-height:1.55; margin:0 0 8px; }
  #detail { white-space:pre-wrap; color:var(--muted); font-size:12px; margin:0 0 12px; }
  #kind { color:var(--accent2); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
  #state { color:var(--accent2); font-size:12px; margin:6px 0; white-space:pre-wrap; }
  #error { color:#fecaca; font-size:12px; min-height:1px; margin:6px 0; }
  #options, #actions { display:flex; flex-direction:column; gap:7px; margin:10px 0; }
  button { font:inherit; border-radius:9px; border:1px solid var(--line); background:#202941; color:var(--fg); padding:8px 13px; cursor:pointer; text-align:left; }
  button:hover { background:#2a3654; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { border-color:#a78bfa; background:linear-gradient(135deg,#7c3aed,#5b21b6); font-weight:650; }
  button.danger { border-color:#7f1d1d; color:#fecaca; }
  input, textarea { width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:9px; background:#0e1320; color:var(--fg); padding:9px 10px; font:inherit; }
  textarea { min-height:44px; resize:vertical; }
  #inputwrap { margin:10px 0; }
  #comment { margin:8px 0; }
  #footer { display:flex; align-items:center; gap:8px; justify-content:flex-end; margin-top:10px; }
  #hint { color:var(--muted); font-size:11px; margin-right:auto; }
  #empty { color:var(--muted); text-align:center; padding:28px 8px; }
  #dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:1px; }
</style>
</head>
<body>
<main id="app">
  <div id="queue"></div>
  <div id="card" hidden>
    <div id="kind"></div>
    <h1 id="title"></h1>
    <p id="message"></p>
    <p id="detail"></p>
    <div id="state" hidden></div>
    <div id="options"></div>
    <div id="inputwrap" hidden><input id="input" autocomplete="off"></div>
    <div id="comment"><textarea id="commentinput" placeholder="Optional comment / reason"></textarea></div>
    <div id="error"></div>
    <div id="actions"></div>
    <div id="footer"><span id="hint"></span><button id="cancel" type="button">Cancel</button></div>
  </div>
  <div id="empty"><span id="dot"></span>Waiting for the next interaction…</div>
</main>
<script type="module">
import { connectInteraction } from "./interaction-client.js";

const $ = (id) => document.getElementById(id);
let client;
let activeId = null;
let busy = false;
let lastList = [];

function text(value) { return value == null ? "" : String(value); }
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function button(label, onClick, kind) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.className = kind || "";
  b.addEventListener("click", () => { void onClick(b); });
  return b;
}
function requestById(id) { return client?.requests.find((r) => r.id === id) || null; }
function nextRequest() { return client?.requests[0] || null; }
function showError(message) { $("error").textContent = text(message); }
function setBusy(value) {
  busy = value;
  document.querySelectorAll("button").forEach((b) => {
    if (b.id !== "cancel") b.disabled = value;
  });
}

function renderState(request) {
  const state = request?.state || {};
  const entries = Object.entries(state).filter(([, value]) => value != null && typeof value !== "object");
  const stateEl = $("state");
  stateEl.hidden = entries.length === 0;
  stateEl.textContent = entries.map(([key, value]) => `${key}: ${String(value)}`).join(" · ");
}

function renderActions(request) {
  const actions = $("actions");
  clear(actions);
  const list = request.actions?.length
    ? request.actions
    : request.kind === "confirm"
      ? [{ id: "approve", label: "Continue", kind: "primary" }, { id: "reject", label: "Reject", kind: "secondary" }]
      : request.kind === "notify"
        ? [{ id: "dismiss", label: "Dismiss", kind: "primary" }]
        : [{ id: "submit", label: request.kind === "input" ? "Submit" : "Send", kind: "primary" }];
  for (const action of list) {
    actions.appendChild(button(text(action.label || action.id), async () => {
      const payload = { action: action.id, value: action.value };
      if (request.kind === "input") payload.value = { text: $("input").value };
      if (request.kind === "confirm") payload.approved = action.id !== "reject" && action.id !== "cancel";
      const comment = $("commentinput").value.trim();
      if (comment) payload.comment = comment;
      await submit(request.id, payload);
    }, action.kind || "secondary"));
  }
}

function renderOptions(request) {
  const options = $("options");
  clear(options);
  if (!request.options?.length || request.kind !== "choose") return;
  for (const option of request.options) {
    const b = button(text(option.label || option.id), async () => {
      const comment = $("commentinput").value.trim();
      await submit(request.id, { action: "choose", value: { id: option.id, label: option.label }, ...(comment ? { comment } : {}) });
    }, "secondary");
    if (option.description) b.title = text(option.description);
    if (option.disabled) b.disabled = true;
    options.appendChild(b);
  }
}

function render() {
  const request = activeId ? requestById(activeId) : nextRequest();
  if (!request) {
    activeId = null;
    $("card").hidden = true;
    $("empty").hidden = false;
    $("queue").textContent = "";
    return;
  }
  activeId = request.id;
  $("card").hidden = false;
  $("empty").hidden = true;
  const pending = client.requests;
  $("queue").textContent = pending.length > 1 ? `${pending.length - 1} more pending` : "";
  $("kind").textContent = request.kind;
  $("title").textContent = text(request.title) || "Action needed";
  $("message").textContent = text(request.message);
  $("detail").textContent = text(request.detail);
  $("detail").hidden = !request.detail;
  $("comment").hidden = request.kind === "notify";
  $("commentinput").placeholder = "Optional comment / reason";
  const inputWrap = $("inputwrap");
  inputWrap.hidden = request.kind !== "input";
  if (request.kind === "input") {
    $("input").placeholder = text(request.input?.placeholder) || "Type here…";
    $("input").type = request.input?.secret ? "password" : "text";
    if (!$("input").value) $("input").value = text(request.input?.defaultValue);
  }
  $("cancel").hidden = request.kind === "notify";
  $("hint").textContent = request.timeoutMs > 0 ? `Timeout ${Math.round(request.timeoutMs / 1000)}s` : "";
  renderState(request);
  renderOptions(request);
  renderActions(request);
  renderState(request);
  if (request.kind === "input") setTimeout(() => $("input").focus(), 30);
}

async function submit(id, payload) {
  if (busy) return;
  setBusy(true);
  showError("");
  try {
    const result = await client.answer(id, payload);
    if (result?.keepOpen) {
      showError("");
      renderState(requestById(id) || { state: result.state || {} });
    } else {
      activeId = null;
    }
  } catch (error) {
    showError(error?.message || String(error));
  } finally {
    setBusy(false);
    render();
  }
}

$("cancel").addEventListener("click", async () => {
  if (!activeId || busy) return;
  setBusy(true);
  showError("");
  try { await client.cancel(activeId); activeId = null; }
  catch (error) { showError(error?.message || String(error)); }
  finally { setBusy(false); render(); }
});

$("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    const request = activeId ? requestById(activeId) : null;
    if (request) void submit(request.id, { action: "submit", value: { text: $("input").value }, ...( $("commentinput").value.trim() ? { comment: $("commentinput").value.trim() } : {}) });
  }
});

try {
  client = await connectInteraction();
  client.onSnapshot((requests) => {
    lastList = requests;
    if (activeId && !requests.some((r) => r.id === activeId)) activeId = null;
    render();
  });
  client.onRequest(() => render());
  client.onUpdate((id) => { if (activeId === id) render(); });
  client.onResolved((id) => {
    if (activeId === id) activeId = null;
    render();
  });
  client.onError((error) => showError(error.message || String(error)));
  // The initial snapshot is delivered before listeners attach; render from the
  // client's canonical list once the subscription handshake is complete.
  render();
  setTimeout(() => render(), 250);
} catch (error) {
  $("empty").hidden = true;
  $("card").hidden = false;
  $("title").textContent = "Interaction unavailable";
  $("message").textContent = error?.message || String(error);
}
</script>
</body>
</html>
