<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1f1f" />
    <title>Pi Web is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1f1f1f;
        color: #cccccc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #9d9d9d;
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        min-height: 40px;
        padding: 0 18px;
        border: 1px solid #383838;
        border-radius: 6px;
        background: #262626;
        color: #cccccc;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #2c2c2c;
      }

      button:focus-visible {
        outline: 2px solid #8ab4f8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" alt="" />
      <h1>Pi Web is offline</h1>
      <p>Reconnect to the local Pi Web server, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
